<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Droword</title>
<style>
  :root { color-scheme: light dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    max-width: 680px;
    margin: 0 auto;
    padding: 48px 20px 80px;
    color: #1c1c1e;
    background: #fff;
    line-height: 1.6;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #f2f2f7; background: #1c1c1e; }
    a { color: #0a84ff; }
    .card { background: rgba(255,255,255,0.06); }
  }
  h1 { font-size: 36px; font-weight: 700; letter-spacing: -0.5px; }
  .tag { color: #8e8e93; margin: 8px 0 28px; }
  .card {
    display: block;
    background: #f2f2f7;
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 12px;
    text-decoration: none;
    color: inherit;
  }
  .card strong { display: block; font-size: 17px; margin-bottom: 4px; }
  .card span { font-size: 14px; color: #8e8e93; }
  a { color: #007aff; }
